[project]
name = "dt-cloud"
version = "0.1.0"
description = "Per-user attribution and reporting for Marin GCS storage"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "duckdb>=1.0",
    "fsspec>=2024.0.0",
    "gcsfs>=2024.0.0",
    "google-cloud-storage>=2.14",
    "pandas>=2.0",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    # `dt-cloud digest` drives Slack via thrds; pinned to the `py` branch (has
    # editable image blocks + per-message sender) at the SHA gcs runs in prod.
    # GitHub tarball (not git+…) so `pip install ./cloud` works in the git-less
    # python:slim image. Bump the SHA to update.
    "thrds @ https://github.com/runsascoded/thrds/archive/70548988ac6827a81a770b938b36057f67ae0e3d.tar.gz",
]

[project.optional-dependencies]
wandb = ["wandb>=0.19"]
sheets = ["gspread>=6.0"]  # `sheet-push` → Google Sheets (ADC auth)
plot = ["matplotlib>=3.8"]  # `dt-cloud digest` OP mosaic (digest_plot)

[project.scripts]
dt-cloud = "dt_cloud.cli:main"

[dependency-groups]
test = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# the direct-URL `thrds` pin above
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dt_cloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
