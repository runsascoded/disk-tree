# Manual owners for prefixes no per-user signal covers. Deepest-prefix-wins
# still applies, so per-user signals inside these trees override a row here.
# A `*` in the bucket position fans out over the listing's buckets at report
# time. `user: ~` (no user) is an explicit "nobody" for a subtree of a user
# prefix. Shared corpora / infra trees (raw, tokenized, datakit, tmp, ...) are
# deliberately NOT listed: with no person they are unclaimed, which is the
# state that asks someone to claim or sweep them.
prefix_owners:
  # scratch/<user>/ segments (not definitionally per-user like users/, so
  # only known-user segments are mapped)
  - prefix: gs://marin-*/scratch/ahmed/
    user: ahmed-ahmed
  - prefix: gs://marin-*/scratch/kaiyue/
    user: kaiyue-wen
  - prefix: gs://marin-*/scratch/michaelryan/
    user: michael-ryan
  - prefix: gs://marin-*/scratch/rav/
    user: rafal-wojdyla
  - prefix: gs://marin-us-east5/pinlin_calvin_xu/
    user: calvin-xu
  - prefix: gs://marin-*/julian/
    user: julian
  # Calvin's data-mixture swarms (Percy, 8/18 call). Only ~350 of the ~1,060
  # swarm dirs ever logged a W&B run (all his), so run-matching can't cover the
  # rest — the name pattern can. Path-glob: `*` matches within one segment.
  - prefix: gs://marin-*/grug/swarm_*/
    user: calvin-xu
  # Tony Lee") — 123 `checkpoints/exp_sft_qwen3_*_selfinstill_*` dirs across
  # east5/central1/central2, ~92 TiB, none logged W&B runs. Segment glob catches
  # the one `exp_fzzhang_sft_…_selfinstill_…` variant too.
  - prefix: gs://marin-*/checkpoints/*selfinstill*/
    user: tony-lee
  - prefix: gs://marin-*/checkpoints/olmix-swarm/
    user: calvin-xu
  - prefix: gs://marin-*/user/rav/
    user: rafal-wojdyla
  - prefix: gs://marin-us-central1/ttl=30d/dlwh/
    user: david-hall
  - prefix: gs://marin-eu-west4/tomat/
    user: ryan-williams
