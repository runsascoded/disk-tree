# CF Pages config for the PUBLIC R2 deploy (r2.rbw.sh) — the union-of-roots Map
# over public R2 buckets (ctbk, crashes, jc-taxes). Unlike gcs/cw this deploy is
# anonymous (no CF Access, no app gate): `PUBLIC_READ` grants the base viewer
# scope to everyone (reads open, mutations still closed — see _lib/auth.ts).
#
# Deploy:  CLOUDFLARE_API_TOKEN=$CF_TOKEN wrangler pages deploy dist --project-name disk-tree-r2
# (Build with the r2 store + public auth — these are BUILD-time Vite vars, not
#  wrangler [vars]:  VITE_STORE=r2 VITE_AUTH_MODE=public pnpm build)
name = "disk-tree-r2"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"

# D1 holds only the index footer (index_schema + index_row_groups) for this
# public deploy — no marks/auth/grants tables (marks:false, PUBLIC_READ).
# Create:  wrangler d1 create disk-tree-r2-db  (paste database_id below), then
#   wrangler d1 migrations apply disk-tree-r2-db --remote
# (needs CLOUDFLARE_ACCOUNT_ID + a D1-scoped token). The index-footer migration
# lives in the cw lineage today; the merged lineage is mgu's convergence work
# (specs/disk-tree-as-base.md → convergence.md seam 3).
[[d1_databases]]
binding = "DB"
database_name = "disk-tree-r2-db"
database_id = "<run `wrangler d1 create disk-tree-r2-db`>"
migrations_dir = "migrations/cw"
remote = true

[observability]
enabled = true

[vars]
ROOT_LABEL = "public R2"
BASE_SCOPE = "r2"
PUBLIC_READ = "1"                # anonymous viewer scope; reads open (_lib/auth.ts)
SNAPSHOTS_SUBDIR = "r2"          # this store's snapshots: snapshots/r2/ (_lib/shared.ts)
INDEX_VARIANTS = "path"          # no ownership → no by-user tiers (index_footer.py mirror)
# The index store: point the reader (makeStore, _lib/index.ts) at R2 instead of
# GCS. Fill STORE_ENDPOINT from $R2_ENDPOINT_URL (the account's R2 S3 endpoint);
# STORE_BUCKET is the bucket the daily ingestion writes the tiers into.
STORE_ENDPOINT = "https://<account>.r2.cloudflarestorage.com"
STORE_BUCKET = "disk-tree-demo"
STORE_REGION = "auto"

# Secrets (set with `wrangler pages secret put <NAME> --project-name disk-tree-r2`):
#   STORE_ACCESS_KEY_ID / STORE_SECRET_ACCESS_KEY — R2 read-only creds for the
#     index bucket (the RO keypair; the reader only GETs the index tiers).
#   No GCS_HMAC_*, GCP_SA_KEY, or ACCESS_* — this deploy is public + GCS-free.
