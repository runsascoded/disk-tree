<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="disk-tree">
  <!-- A storage treemap that reads as a Mondrian: the app's own 2+4 partition,
       cells repainted in this deployment's palette. See specs/ (disk-tree marks). -->
  <rect width="512" height="512" rx="112" fill="#1f1e1b"/>
  <g stroke="#1f1e1b" stroke-width="14">
    <rect x="56"  y="56"  width="190" height="232" fill="#9c4f2f"/>
    <rect x="56"  y="288" width="190" height="168" fill="#e7ddc7"/>
    <rect x="246" y="56"  width="210" height="150" fill="#c0883a"/>
    <rect x="246" y="206" width="120" height="120" fill="#465c6e"/>
    <rect x="366" y="206" width="90"  height="120" fill="#6f7d3f"/>
    <rect x="246" y="326" width="210" height="130" fill="#b5aa9f"/>
  </g>
</svg>
