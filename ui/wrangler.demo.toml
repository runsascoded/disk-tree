# Cloudflare Pages: the **public open** disk-tree demo (`r2.rbw.sh`). Same SPA +
# read-subset Functions as `wrangler.toml`, but over a corpus of *public* R2
# buckets (`disk-tree-demo`, reduced scans of nj-crashes / jc-taxes / ctbk) with
# the auth gate OFF (`PUBLIC_OPEN`) — no D1, no secrets. The gated `disk-tree`
# project (private laptop scan) is untouched; deploy this one with:
#   direnv exec .. pnpm exec wrangler pages deploy dist -c wrangler.demo.toml
name = "disk-tree-demo"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

[[r2_buckets]]
binding = "SCANS"
bucket_name = "disk-tree-demo"

[vars]
SCANS_PREFIX = "scans/"
PUBLIC_OPEN = "1"
