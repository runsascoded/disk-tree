# The capture trigger (specs/capture-ingest-trigger.md): consumes the
# `disk-tree-captures` queue (fed by the `disk-tree` bucket's `_SUCCESS.json`
# event notification, `cf/__main__.py`) and submits each finished capture to
# the m3 Batch ingest. Deploy: `pnpm -C cf/capture-trigger deploy` under
# direnv; secrets: `cf/capture-trigger/put-secrets`.
name = "disk-tree-capture-trigger"
main = "src/index.ts"
compatibility_date = "2026-09-01"
account_id = "0dcad5654e9744de6616f74b8df4af63"
workers_dev = false

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "disk-tree"

[[queues.consumers]]
queue = "disk-tree-captures"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 10
# One batch at a time: the `_INGEST.json` check-then-write is per message, so
# serial delivery keeps a redelivered message from racing its first copy.
max_concurrency = 1

[vars]
AWS_REGION = "us-east-1"
JOB_QUEUE = "disk-tree-m3"
JOB_DEFINITION = "disk-tree-m3-ingest"
BUCKET_NAME = "disk-tree"
# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (IAM user
# `disk-tree-m3-capture-trigger`: `batch:SubmitJob` on the queue + job def only).
