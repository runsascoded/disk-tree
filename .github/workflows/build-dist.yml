name: Build @disk-tree/react dist branch

# Builds a SHA-pinnable dist branch for `packages/react/` so external
# consumers (marin's site, etc.) can `pnpm add
# github:runsascoded/disk-tree#<sha>` without pulling the whole
# monorepo. Uses runsascoded/npm-dist in monorepo mode (`pkgs:
# packages/react`), source-first (no compile — the package ships .ts).
#
# Fires on any push to main that touches packages/react/, and on
# manual dispatch for one-off rebuilds.

on:
  push:
    branches: [main]
    paths:
      - "packages/react/**"
      - ".github/workflows/build-dist.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref to build from (default: main)"
        type: string
        default: ""

jobs:
  build-dist:
    permissions:
      contents: write
    uses: runsascoded/npm-dist/.github/workflows/build-dist.yml@v1
    with:
      pkgs: packages/react
      source_ref: ${{ inputs.source_ref }}
      # Source-first — `main`/`types` in package.json point at src/*.ts,
      # so the built branch keeps `src/` as-is next to the transformed
      # package.json.
      source_dirs: src
      extra_files: README.md
      # The package's `build` script just typechecks (source-first, no
      # emit); npm-dist runs it to smoke-test the source before publishing.
