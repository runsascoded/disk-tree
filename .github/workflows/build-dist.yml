name: Build @disk-tree/react dist branch

# Builds a SHA-pinnable `dist` branch for `packages/react/` so external
# consumers (marin's site, file-tree, etc.) can `pnpm add
# github:runsascoded/disk-tree#<dist-sha>` without pulling the whole
# monorepo. Uses runsascoded/npm-dist in `package_dir` mode, which packs
# the one package and flattens it to the dist branch ROOT — so the git dep
# resolves to `@disk-tree/react` directly (monorepo `pkgs` mode nested it
# under a workspace root, which a git dep can't select). Source-first (no
# compile — the package ships .ts; `pnpm pack` respects its `files`).
#
# Fires on any push to main that touches packages/react/, and on
# manual dispatch for one-off rebuilds.

on:
  push:
    branches: [main]
    paths:
      - "packages/react/**"
      - ".github/workflows/build-dist.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref to build from (default: main)"
        type: string
        default: ""

jobs:
  build-dist:
    permissions:
      contents: write
    uses: runsascoded/npm-dist/.github/workflows/build-dist.yml@v1
    with:
      # Package at the dist branch ROOT → `github:runsascoded/disk-tree#<dist-sha>`
      # resolves to `@disk-tree/react`. (`pnpm pack` carries `src/` + README per
      # the package's `files`, so no `source_dirs`/`extra_files` needed here.)
      package_dir: packages/react
      source_ref: ${{ inputs.source_ref }}
      # The package's `build` script just typechecks (source-first, no
      # emit); npm-dist runs it to smoke-test the source before publishing.
